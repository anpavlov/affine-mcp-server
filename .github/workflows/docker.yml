name: Docker

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing vX.Y.Z release tag to rebuild
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-pr-image:
    if: github.event_name == 'pull_request'
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: affine-mcp-server:pr-smoke
          cache-from: type=gha

      - name: Smoke test image
        run: |
          EXPECTED_VERSION="$(node -p 'require("./package.json").version')"
          ACTUAL_VERSION="$(docker run --rm affine-mcp-server:pr-smoke --version)"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          CONTAINER_UID="$(docker run --rm --entrypoint id affine-mcp-server:pr-smoke -u)"
          test -n "$CONTAINER_UID"
          test "$CONTAINER_UID" != "0"
          SMOKE_TOKEN="$(openssl rand -hex 32)"
          CONTAINER_ID="$(docker run -d -e AFFINE_MCP_HTTP_TOKEN="$SMOKE_TOKEN" affine-mcp-server:pr-smoke)"
          trap 'docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..40}; do
            STATE="$(docker inspect -f '{{.State.Status}}' "$CONTAINER_ID")"
            RUNNING="$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID")"
            if [ "$RUNNING" != "true" ]; then
              echo "Container stopped before becoming healthy (state: $STATE)"
              docker logs "$CONTAINER_ID"
              exit 1
            fi
            HEALTH_STATUS="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER_ID")"
            if [ "$HEALTH_STATUS" = "healthy" ]; then
              if ! HEALTH_JSON="$(timeout 10s docker exec "$CONTAINER_ID" wget -qO- http://127.0.0.1:3000/healthz)"; then
                echo "Container health endpoint probe failed"
                docker logs "$CONTAINER_ID"
                exit 1
              fi
              if ! echo "$HEALTH_JSON" | grep -Eq '"protected"[[:space:]]*:[[:space:]]*true'; then
                echo "Container health endpoint did not report protected mode"
                docker logs "$CONTAINER_ID"
                exit 1
              fi
              exit 0
            fi
            if [ "$HEALTH_STATUS" = "unhealthy" ]; then
              docker logs "$CONTAINER_ID"
              exit 1
            fi
            sleep 2
          done
          echo "Container did not become healthy after $attempt attempts"
          docker inspect "$CONTAINER_ID"
          exit 1

  validate-release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
        run: node scripts/verify-release.mjs --tag "$RELEASE_TAG" --commit HEAD --main-ref origin/main
      - run: npm run ci
      - name: Smoke test packed artifact
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          VERSION="$(node -p 'require("./package.json").version')"
          npm run test:package-smoke -- --tarball "$RUNNER_TEMP/affine-mcp-server-$VERSION.tgz"
      - run: npx playwright install --with-deps chromium
      - name: Run isolated AFFiNE integration and browser tests
        run: npm run test:e2e
      - name: Upload failed browser results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-playwright-results
          path: tests/playwright/test-results/

  build-and-push-release:
    needs: validate-release
    if: github.event_name != 'pull_request'
    name: Build & Push Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify release tag and metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
        run: |
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          git fetch origin main --no-tags
          node scripts/verify-release.mjs --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --main-ref origin/main
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # semver tags: v1.2.3 to 1.2.3, 1.2, 1, latest
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.title=affine-mcp-server
            org.opencontainers.image.description=MCP server for AFFiNE with full read/write support
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish fork GitHub release
        if: github.repository == 'anpavlov/affine-mcp-server'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const version = process.env.RELEASE_TAG.slice(1);
          const notes = fs.readFileSync('RELEASE_NOTES.md', 'utf8');
          const section = notes.split('## Version ').find(value => value.startsWith(`${version} (`));
          if (!section) throw new Error(`Missing release notes for ${version}`);
          fs.writeFileSync('/tmp/fork-release-notes.md', `## Version ${section}`);
          JS
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/fork-release-notes.md
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file /tmp/fork-release-notes.md --latest
          fi
